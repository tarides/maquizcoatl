# The hax prototype of experiment #5: one crate, extracted by hax to F*
# and to Rocq (build.sh), and compiled by rustc into the static library
# the C caller links.
[package]
name = "vu"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[dependencies]
hax-lib = "=0.5.0"

[profile.release]
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.dev]
panic = "abort"
