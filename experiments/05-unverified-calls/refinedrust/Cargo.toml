# The RefinedRust prototype of experiment #5 (run E): checked by
# RefinedRust (cargo refinedrust, then dune) and compiled by rustc into
# the static library the C caller links.
[package]
name = "vu"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["staticlib"]

[profile.release]
opt-level = 2
overflow-checks = true
panic = "abort"

[profile.dev]
panic = "abort"
